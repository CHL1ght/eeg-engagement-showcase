[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-engagement-showcase"
version = "0.1.0"
description = "EEG engineering showcase with reproducible synthetic EDF tests"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "joblib==1.5.3", "mne==1.12.1", "numpy==2.5.1",
  "scikit-learn==1.9.0", "scipy==1.18.0", "pyriemann==0.12",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
